name: Import Premiere card database
on:
  workflow_dispatch:
permissions: {}
jobs:
  snapshot:
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/import_premiere.py
      - name: Run all tests
        run: node --test
      - name: Commit validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/premiere.json
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot validated Premiere card database"
            git push origin "HEAD:${GITHUB_REF}"
          fi
